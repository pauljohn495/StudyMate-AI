<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#5050d8" />
    <title>StudyMate AI — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#17233b;font-family:Inter,ui-sans-serif,system-ui,sans-serif;padding:24px}.card{max-width:440px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:40px;box-shadow:0 12px 40px rgba(30,41,59,.08)}.icon{display:grid;place-items:center;width:64px;height:64px;margin:auto;border-radius:18px;background:#5050d8;color:#fff;font-size:32px}h1{margin:24px 0 8px;font-size:26px}p{margin:0;color:#64748b;line-height:1.6;font-size:14px}button{margin-top:24px;border:0;border-radius:12px;background:#5050d8;color:#fff;font-weight:700;padding:12px 18px;cursor:pointer}@media(prefers-color-scheme:dark){body{background:#020617;color:#f8fafc}.card{background:#0f172a;border-color:#1e293b}p{color:#94a3b8}}
    </style>
  </head>
  <body><main class="card"><div class="icon">✦</div><h1>You’re offline</h1><p>StudyMate cannot reach the network. Reopen a previously visited workspace page, or reconnect to load new material and AI features.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
