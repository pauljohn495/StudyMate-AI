services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studymate
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate_dev
    ports:
      - "5432:5432"
    volumes:
      - studymate_postgres:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymate -d studymate"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  studymate_postgres:
