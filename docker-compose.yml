services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: studymate
      MYSQL_USER: studymate
      MYSQL_PASSWORD: studymate_dev
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    volumes:
      - studymate_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ustudymate", "-pstudymate_dev", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  studymate_mysql:
